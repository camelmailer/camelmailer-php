name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
        include:
          # Unpinned, the jobs above resolve the newest Guzzle. This one keeps
          # the oldest supported major honest.
          - php: "8.4"
            guzzle: "^7.5"
    name: PHP ${{ matrix.php }}${{ matrix.guzzle && format(' / Guzzle {0}', matrix.guzzle) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Guzzle
        if: matrix.guzzle
        run: composer require "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Tests
        run: composer test
